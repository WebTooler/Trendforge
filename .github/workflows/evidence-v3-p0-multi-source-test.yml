name: Evidence V3 Lab — P0 Multi Source Test

on:
  workflow_dispatch:

jobs:
  multi-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          ref: evidence-v3-lab
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run multi-source deterministic validation
        run: node scripts/test-evidence-extraction-multi-source.mjs
