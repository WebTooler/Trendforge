name: Evidence V3 — Fresh Source Verification Run

on:
  push:
    branches: ["evidence-v3-lab"]
    paths:
      - "scripts/trend-research.mjs"
      - "scripts/google-news-url-resolver.mjs"
      - "scripts/score-trends.ts"
      - "scripts/verify-trend-sources.mjs"
      - "data/trend-candidates.json"
      - ".github/workflows/evidence-v3-source-verification-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidence-v3-source-verification-run
  cancel-in-progress: true

jobs:
  source-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7
        with:
          ref: evidence-v3-lab
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Refresh trend research
        run: node scripts/trend-research.mjs

      - name: Score fresh candidates
        run: npx tsx scripts/score-trends.ts

      - name: Verify and discover publisher sources
        run: node scripts/verify-trend-sources.mjs

      - name: Report source verification
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('data/source-verification.json','utf8'));
          const records = x.records ?? [];
          const count = (s) => records.filter(r => r.status === s).length;
          const discovered = records.reduce((n,r) => n + (r.discoveredSourceCount || 0), 0);
          const multi = records.filter(r => (r.independentPublisherCount || 0) >= 2).length;
          const reachable = records.filter(r => (r.relevantReachableSourceCount || 0) > 0).length;
          console.log(`Candidates checked: ${records.length}`);
          console.log(`Verified: ${count('verified')}`);
          console.log(`Partial: ${count('partial')}`);
          console.log(`Unverified: ${count('unverified')}`);
          console.log(`Candidates with relevant reachable sources: ${reachable}`);
          console.log(`Discovered publisher sources: ${discovered}`);
          console.log(`Candidates with 2+ independent publisher families: ${multi}`);
          NODE

      - name: Partial verification breakdown
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('data/source-verification.json','utf8'));
          const records = x.records ?? [];
          const partial = records.filter(r => r.status === 'partial');
          const n = (fn) => partial.filter(fn).length;
          const reachable = r => (r.relevantReachableSourceCount || 0) > 0;
          const families = r => (r.independentPublisherCount || 0);
          const checks = r => (r.sources || r.sourceChecks || r.verifiedSources || []).length;
          const discovered = r => (r.discoveredSourceCount || 0) > 0;

          console.log(`Partial candidates: ${partial.length}`);
          console.log(`No reachable source: ${n(r => !reachable(r))}`);
          console.log(`Reachable source: ${n(reachable)}`);
          console.log(`Only 1 publisher family: ${n(r => families(r) === 1)}`);
          console.log(`2+ publisher families: ${n(r => families(r) >= 2)}`);
          console.log(`Only 1 relevant reachable source: ${n(r => (r.relevantReachableSourceCount || 0) === 1)}`);
          console.log(`2+ relevant reachable sources: ${n(r => (r.relevantReachableSourceCount || 0) >= 2)}`);
          console.log(`Source checks <=1: ${n(r => checks(r) <= 1)}`);
          console.log(`Discovered sources present: ${n(discovered)}`);
          console.log(`No discovered sources: ${n(r => !discovered(r))}`);

          const byCategory = {};
          for (const r of partial) {
            const c = r.category || 'Unknown';
            byCategory[c] = (byCategory[c] || 0) + 1;
          }
          console.log('Partial by category:', JSON.stringify(byCategory));
          console.log('Note: diagnostic buckets overlap; they are not additive.');
          NODE

      - name: Partial confidence root-cause breakdown
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const x = JSON.parse(fs.readFileSync('data/source-verification.json','utf8'));
          const partial = (x.records ?? []).filter(r => r.status === 'partial');

          const bucket = (name, fn) => console.log(`${name}: ${partial.filter(fn).length}`);
          bucket('Reachable but non-credible only', r => r.reachableSourceCount > 0 && r.credibleSourceCount === 0);
          bucket('Reachable + some credible but not enough', r => r.reachableSourceCount > 0 && r.credibleSourceCount > 0 && r.credibleSourceCount < r.reachableSourceCount);
          bucket('No credible reachable source', r => r.credibleSourceCount === 0);
          bucket('Single publisher family + single relevant source', r => r.independentPublisherCount === 1 && r.relevantReachableSourceCount === 1);
          bucket('Single publisher family + 2+ relevant sources', r => r.independentPublisherCount === 1 && r.relevantReachableSourceCount >= 2);
          bucket('2+ publisher families but partial', r => r.independentPublisherCount >= 2);
          bucket('Confidence 45-54', r => r.confidence >= 45 && r.confidence < 55);
          bucket('Confidence 55-69', r => r.confidence >= 55 && r.confidence < 70);

          const samples = [...partial].sort((a,b) => a.confidence-b.confidence).slice(0,10);
          console.log('Lowest-confidence partial samples:');
          for (const r of samples) {
            console.log(JSON.stringify({
              title: r.title,
              category: r.category,
              confidence: r.confidence,
              sourceCount: r.sourceCount,
              reachable: r.reachableSourceCount,
              credible: r.credibleSourceCount,
              families: r.independentPublisherCount,
              relevant: r.relevantReachableSourceCount,
              discovered: r.discoveredSourceCount
            }));
          }
          NODE
