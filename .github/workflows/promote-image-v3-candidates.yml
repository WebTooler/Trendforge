name: Promote Existing Image V3 Candidates

on:
  push:
    branches:
      - image-v3-test-lab
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  SOURCE_RUN_NUMBER: '13'

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Locate existing successful V3 artifact
        id: locate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/360505363/runs?branch=image-v3-test-lab&per_page=30")
          RUN_ID=$(node -e "const x=JSON.parse(process.argv[1]); const r=x.workflow_runs.find(r=>r.run_number===Number(process.env.SOURCE_RUN_NUMBER)&&r.conclusion==='success'); if(!r) process.exit(2); console.log(r.id)" "$RUN_JSON")
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Using successful Image V3 test run #${SOURCE_RUN_NUMBER}: $RUN_ID"

      - name: Download existing generated images
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.locate.outputs.run_id }}
        run: |
          set -euo pipefail
          ARTIFACT_JSON=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts")
          ARTIFACT_ID=$(node -e "const x=JSON.parse(process.argv[1]); const a=x.artifacts.find(a=>a.name==='trendforge-image-v3-article-test-13'&&!a.expired); if(!a) process.exit(2); console.log(a.id)" "$ARTIFACT_JSON")
          curl -fsSL -L -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" -o /tmp/v3.zip
          rm -rf /tmp/v3 && mkdir -p /tmp/v3
          unzip -q /tmp/v3.zip -d /tmp/v3
          find /tmp/v3 -maxdepth 2 -type f -print

      - name: Promote images and update article frontmatter
        run: |
          set -euo pipefail
          mkdir -p public/images/articles
          slugs=(
            apple-eyes-2029-ai-server-with-m-series-ultra-chips
            how-to-move-passwords-and-passkeys-between-managers-on-android
            beyond-obscurity-navigating-the-dual-eras-of-drone-threats-and-ai-driven-vulnerabilities
          )
          for slug in "${slugs[@]}"; do
            src="/tmp/v3/${slug}.png"
            test -f "$src" || { echo "Missing $src"; exit 1; }
            cp "$src" "public/images/articles/${slug}.png"
            article="content/articles/${slug}.md"
            python3 - "$article" "$slug" <<'PY'
import pathlib, sys, re
p = pathlib.Path(sys.argv[1])
slug = sys.argv[2]
s = p.read_text()
s = re.sub(r'^image:\s*.*$', f'image: "/Trendforge/images/articles/{slug}.png"', s, count=1, flags=re.M)
s = re.sub(r'^imageAlt:\s*.*$', 'imageAlt: "Original AI-generated editorial illustration for this TrendForge article"', s, count=1, flags=re.M)
s = re.sub(r'^imageSource:\s*.*$', 'imageSource: "TrendForge original editorial image generation"', s, count=1, flags=re.M)
s = re.sub(r'^imageLicense:\s*.*$', 'imageLicense: "AI-generated original visual"', s, count=1, flags=re.M)
s = re.sub(r'^imageGeneratedBy:\s*.*$', 'imageGeneratedBy: "TrendForge Image V3 — Cloudflare FLUX.2 Klein 9B"', s, count=1, flags=re.M)
p.write_text(s)
PY
          done

      - name: Verify promoted assets
        run: |
          set -euo pipefail
          file public/images/articles/*.png
          git diff --stat
          git diff -- content/articles/apple-eyes-2029-ai-server-with-m-series-ultra-chips.md

      - name: Commit promoted candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/articles/*.png content/articles/*.md
          git diff --cached --quiet && { echo "No promotion changes"; exit 0; }
          git commit -m "test: attach existing Image V3 candidates to articles [skip ci]"
          git push origin HEAD:image-v3-test-lab
