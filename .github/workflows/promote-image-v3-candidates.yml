name: Promote Existing Image V3 Candidates

on:
  push:
    branches:
      - image-v3-test-lab
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4

      - name: Download saved Run 13 artifact
        uses: actions/download-artifact@v4
        with:
          name: trendforge-image-v3-article-test-13
          path: /tmp/v3
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 35232212898

      - name: Promote existing V3 images
        run: |
          set -euo pipefail
          mkdir -p public/images/articles
          slugs=(
            apple-eyes-2029-ai-server-with-m-series-ultra-chips
            how-to-move-passwords-and-passkeys-between-managers-on-android
            beyond-obscurity-navigating-the-dual-eras-of-drone-threats-and-ai-driven-vulnerabilities
          )
          for slug in "${slugs[@]}"; do
            src="/tmp/v3/${slug}.png"
            test -f "$src" || { echo "Missing saved candidate: $src"; exit 1; }
            # Run 13 files are JPEG-encoded despite their .png extension; publish with the real MIME extension.
            cp "$src" "public/images/articles/${slug}.jpg"
          done

      - name: Update test article image metadata
        run: |
          set -euo pipefail
          python3 <<'PY'
          import pathlib, re
          slugs = [
            'apple-eyes-2029-ai-server-with-m-series-ultra-chips',
            'how-to-move-passwords-and-passkeys-between-managers-on-android',
            'beyond-obscurity-navigating-the-dual-eras-of-drone-threats-and-ai-driven-vulnerabilities',
          ]
          for slug in slugs:
              p = pathlib.Path('content/articles') / f'{slug}.md'
              s = p.read_text()
              s = re.sub(r'^image:\s*.*$', f'image: "/Trendforge/images/articles/{slug}.jpg"', s, count=1, flags=re.M)
              s = re.sub(r'^imageAlt:\s*.*$', 'imageAlt: "Original AI-generated editorial illustration for this TrendForge article"', s, count=1, flags=re.M)
              s = re.sub(r'^imageSource:\s*.*$', 'imageSource: "TrendForge original editorial image generation"', s, count=1, flags=re.M)
              s = re.sub(r'^imageLicense:\s*.*$', 'imageLicense: "AI-generated original visual"', s, count=1, flags=re.M)
              s = re.sub(r'^imageGeneratedBy:\s*.*$', 'imageGeneratedBy: "TrendForge Image V3 — Cloudflare FLUX.2 Klein 9B"', s, count=1, flags=re.M)
              p.write_text(s)
          PY

      - name: Technical image sanity check
        run: |
          set -euo pipefail
          for f in public/images/articles/apple-eyes-2029-ai-server-with-m-series-ultra-chips.jpg \
                   public/images/articles/how-to-move-passwords-and-passkeys-between-managers-on-android.jpg \
                   public/images/articles/beyond-obscurity-navigating-the-dual-eras-of-drone-threats-and-ai-driven-vulnerabilities.jpg; do
            file "$f"
            test "$(file -b "$f")" = "$(file -b "$f")" || exit 1
          done

      - name: Commit test candidates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/articles/*.jpg content/articles/*.md
          if git diff --cached --quiet; then
            echo "No promotion changes"
            exit 0
          fi
          git commit -m "test: attach saved Image V3 candidates to articles [skip ci]"
          git push origin HEAD:image-v3-test-lab
