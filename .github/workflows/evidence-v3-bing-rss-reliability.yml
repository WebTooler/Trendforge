name: Evidence V3 — Bing RSS Reliability Matrix
on:
  workflow_dispatch:
  push:
    branches: [evidence-v3-lab]
    paths:
      - 'scripts/test-bing-rss-reliability.mjs'
      - '.github/workflows/evidence-v3-bing-rss-reliability.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: evidence-v3-lab}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/test-bing-rss-reliability.mjs