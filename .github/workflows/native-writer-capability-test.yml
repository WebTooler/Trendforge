name: TrendForge Native Writer Capability Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trendforge-native-writer.mjs'
      - 'scripts/test-native-writer-capability.mjs'
      - '.github/workflows/native-writer-capability-test.yml'

permissions:
  contents: read

jobs:
  native-writer-capability:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ''
      GROQ_API_KEY: ''
      OPENAI_API_KEY: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Regenerate fresh evidence discovery
        run: |
          test -f data/scored-trends.json
          rm -f data/source-verification.json data/decision-queue.json
          node scripts/verify-trend-sources.mjs
          node scripts/trend-decision-engine.mjs
          node -e "const fs=require('fs'); for(const p of ['data/source-verification.json','data/decision-queue.json']){if(!fs.existsSync(p))throw new Error('Evidence regeneration failed: '+p)}; const v=JSON.parse(fs.readFileSync('data/source-verification.json','utf8')); const q=JSON.parse(fs.readFileSync('data/decision-queue.json','utf8')); if(!v.records?.length)throw new Error('Evidence regeneration produced no records'); if(!q.decisions?.length)throw new Error('Decision regeneration produced no decisions'); console.log('Fresh evidence discovery and decision queue regenerated successfully.');"
      - name: Run Native Writer quality and production-gate test
        run: node scripts/test-native-writer-capability.mjs
      - name: Upload Native Writer proof
        if: always() && hashFiles('native-writer-capability-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: native-writer-capability-proof
          path: native-writer-capability-result.json
