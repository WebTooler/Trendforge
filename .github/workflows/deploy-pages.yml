name: Deploy TrendForge to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["TrendForge Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_NEWSLETTER_FORM_ACTION: ${{ vars.NEXT_PUBLIC_NEWSLETTER_FORM_ACTION }}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate search index
        run: npx tsx scripts/generate-search-index.ts

      - name: Prepare ads.txt
        shell: bash
        run: |
          if [ -z "${ADSENSE_PUBLISHER_ID:-}" ]; then
            rm -f public/ads.txt
            echo "AdSense publisher ID not configured; ads.txt will not be published."
          elif [[ ! "$ADSENSE_PUBLISHER_ID" =~ ^pub-[0-9]{16}$ ]]; then
            echo "Invalid ADSENSE_PUBLISHER_ID format. Expected pub- followed by 16 digits."
            exit 1
          else
            printf 'google.com, %s, DIRECT, f08c47fec0942fa0\n' "$ADSENSE_PUBLISHER_ID" > public/ads.txt
            echo "Generated public/ads.txt for the configured AdSense publisher."
          fi

      - name: Build static site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
