name: Deploy TrendForge to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    workflows: ["TrendForge Pipeline"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      NEXT_PUBLIC_NEWSLETTER_FORM_ACTION: ${{ vars.NEXT_PUBLIC_NEWSLETTER_FORM_ACTION }}
      NEXT_PUBLIC_ADSENSE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
      ADSENSE_PUBLISHER_ID: ${{ vars.ADSENSE_PUBLISHER_ID }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies with retry
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "npm install attempt $attempt/3"
            if npm install --no-audit --no-fund; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "npm install failed after 3 attempts"
          exit 1

      - name: Sync article source into runtime index
        run: npx tsx scripts/sync-articles.ts

      - name: Generate search index
        run: npx tsx scripts/generate-search-index.ts

      - name: Prepare ads.txt
        shell: bash
        run: |
          if [ -z "${ADSENSE_PUBLISHER_ID:-}" ]; then
            rm -f public/ads.txt
            echo "AdSense publisher ID not configured; ads.txt will not be published."
          elif [[ ! "$ADSENSE_PUBLISHER_ID" =~ ^pub-[0-9]{16}$ ]]; then
            echo "Invalid ADSENSE_PUBLISHER_ID format. Expected pub- followed by 16 digits."
            exit 1
          else
            printf 'google.com, %s, DIRECT, f08c47fec0942fa0\n' "$ADSENSE_PUBLISHER_ID" > public/ads.txt
            echo "Generated public/ads.txt for the configured AdSense publisher."
          fi

      - name: Build static site
        run: npm run build

      - name: Validate production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/search-index.json
          if [ -n "${ADSENSE_PUBLISHER_ID:-}" ]; then test -f out/ads.txt; fi
          if find out -type f \( -name '.env' -o -name '.env.*' -o -name '*secret*' \) -print -quit | grep -q .; then
            echo "Potential secret file detected in production artifact."
            exit 1
          fi
          echo "Production artifact validation passed."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
