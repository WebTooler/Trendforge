name: Evidence V3 — Bing RSS Query Matrix

on:
  workflow_dispatch:
  push:
    branches: [evidence-v3-lab]
    paths:
      - 'scripts/test-bing-rss-matrix.mjs'
      - '.github/workflows/evidence-v3-bing-rss-matrix.yml'

jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: evidence-v3-lab
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node scripts/test-bing-rss-matrix.mjs
