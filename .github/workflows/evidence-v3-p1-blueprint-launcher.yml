name: Evidence V3 Lab — P1 Evidence Article Blueprint

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/evidence-v3-p1-blueprint-launcher.yml'

jobs:
  blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          ref: evidence-v3-lab
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run P1 evidence article blueprint policy test
        run: node scripts/test-evidence-article-blueprint.mjs
      - name: Run evidence-aware prompt construction test
        run: node scripts/test-evidence-article-prompt.mjs
