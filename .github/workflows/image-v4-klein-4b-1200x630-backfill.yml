name: TrendForge — FLUX.1 Schnell 1024x576 Article Images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of article images to generate (0 = all)"
        required: false
        default: "3"
        type: string
      production:
        description: "Promote validated images into production article assets (keep false for testing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[flux-production]') }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODEL: "@cf/black-forest-labs/flux-1-schnell"
      WIDTH: "1024"
      HEIGHT: "576"
      OUTPUT_FORMAT: "png"
      OUTPUT_NEURONS_PER_TILE: "4.80"
      NEURONS_PER_STEP: "9.60"
      STEPS: "4"
      LIMIT: ${{ github.event_name == 'push' && '0' || inputs.limit }}
      PRODUCTION: ${{ github.event_name == 'push' && 'true' || inputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$MODEL" = "@cf/black-forest-labs/flux-1-schnell"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "576"
          test "$OUTPUT_FORMAT" = "png"
          mkdir -p flux-backfill/{images,results}
          echo "Model: $MODEL"
          echo "Dimensions: ${WIDTH}x${HEIGHT}"
          echo "Format: ${OUTPUT_FORMAT}"
          echo "FLUX.1 Schnell request: prompt + steps=${STEPS}; output dimensions are normalized after generation"
          echo "Pricing basis: 4.80 neurons per 512x512 tile + 9.60 neurons per step"
          echo "Limit: ${LIMIT:-0}"
          echo "Production promotion: $PRODUCTION"

      - name: Install image normalizer
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock sharp@0.35.4

      - name: Generate article-specific images
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import sharp from 'sharp';
          import { buildImagePrompt } from './scripts/trendforge-visual-planner.mjs';

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const model = process.env.MODEL;
          const width = Number(process.env.WIDTH);
          const height = Number(process.env.HEIGHT);
          const limit = Math.max(0, Number(process.env.LIMIT || 0));
          const production = process.env.PRODUCTION === 'true';
          const outputNeuronsPerTile = Number(process.env.OUTPUT_NEURONS_PER_TILE || 4.80);
          const neuronsPerStep = Number(process.env.NEURONS_PER_STEP || 9.60);
          const steps = Number(process.env.STEPS || 4);
          // FLUX.1 Schnell does not accept width/height; its generated image is normalized to 1024x576 below.
          // Keep this estimate conservative as a one-tile baseline; actual usage is authoritative in Cloudflare.
          const outputTiles = 1;
          const estimatedInputNeurons = 0;
          const estimatedOutputNeurons = outputTiles * outputNeuronsPerTile;
          const estimatedNeuronsPerImage = estimatedOutputNeurons + (neuronsPerStep * steps);
          const articleDir = 'content/articles';
          const outDir = 'flux-backfill/images';
          const resultDir = 'flux-backfill/results';

          const field = (text, key) => {
            const m = text.match(new RegExp('^' + key + ':\\s*"([\\s\\S]*?)"\\s*$', 'm'));
            return m ? m[1].replace(/\\\"/g, '"') : '';
          };
          const yamlEscape = value => value.replace(/\\/g, '\\\\').replace(/"/g, '\\\"').replace(/\r?\n/g, ' ');
          const slugify = value => value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 90);

          const files = fs.readdirSync(articleDir).filter(f => f.endsWith('.md')).sort();
          const selected = limit > 0 ? files.slice(0, limit) : files;
          const manifest = [];
          let failures = 0;

          for (const file of selected) {
            const raw = fs.readFileSync(path.join(articleDir, file), 'utf8');
            const title = field(raw, 'title');
            const description = field(raw, 'description');
            const category = field(raw, 'category') || 'Technology';
            const slug = field(raw, 'slug') || slugify(title) || file.replace(/\\.md$/, '');
            if (!title || !description) {
              failures++;
              manifest.push({ file, slug, status: 'failed', error: 'missing title or description' });
              continue;
            }

            const planned = buildImagePrompt({ title, description, category, body: raw });
            const { brief, prompt } = planned;
            console.log('VISUAL BRIEF:', JSON.stringify(brief));
            console.log('PROMPT LENGTH:', prompt.length);

            const url = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/ai/run/' + model;
            const started = Date.now();
            try {
              // FLUX.1 Schnell currently accepts prompt + steps; width/height are not valid model inputs.
              const resp = await fetch(url, {
                method: 'POST',
                headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, steps })
              });
              const body = Buffer.from(await resp.arrayBuffer());
              const elapsedMs = Date.now() - started;
              if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + body.toString('utf8').slice(0, 500));

              const payload = JSON.parse(body.toString('utf8'));
              const value = payload?.result?.image || payload?.image;
              if (typeof value !== 'string' || !value.trim()) throw new Error('missing result.image');
              const encoded = value.includes(',') ? value.slice(value.indexOf(',') + 1) : value;
              const bytes = Buffer.from(encoded, 'base64');
              const isJpeg = bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
              const isPng = bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47;
              if (!isJpeg && !isPng) throw new Error('decoded payload is not JPEG/PNG');

              const rawMeta = await sharp(bytes).metadata();
              if (!rawMeta.width || !rawMeta.height) throw new Error('unable to read generated image dimensions');
              const normalized = await sharp(bytes)
                .resize({ width, height, fit: 'cover', position: 'centre' })
                .png({ compressionLevel: 9, adaptiveFiltering: true, palette: false })
                .toBuffer();
              const finalMeta = await sharp(normalized).metadata();
              if (finalMeta.width !== width || finalMeta.height !== height) throw new Error('normalized image dimensions are ' + finalMeta.width + 'x' + finalMeta.height);

              const outFile = slug + '.1024x576.png';
              fs.writeFileSync(path.join(outDir, outFile), normalized);

              const row = {
                file, slug, title, category, visualBrief: brief, promptLength: prompt.length,
                width, height, rawWidth: rawMeta.width, rawHeight: rawMeta.height,
                status: 'success', output: outFile, bytes: normalized.length, elapsedMs,
                contentType: resp.headers.get('content-type'), outputContentType: 'image/png',
                outputTiles, outputTilesX: 1, outputTilesY: 1,
                estimatedInputNeurons, estimatedOutputNeurons, estimatedNeuronsPerImage,
                normalized: rawMeta.width !== width || rawMeta.height !== height, model
              };
              manifest.push(row);
              fs.writeFileSync(path.join(resultDir, slug + '.json'), JSON.stringify(row, null, 2));
              console.log('SUCCESS ' + file + ': ' + brief.mode + '; raw ' + rawMeta.width + 'x' + rawMeta.height + ' -> ' + width + 'x' + height + ', ' + normalized.length + ' bytes in ' + elapsedMs + 'ms');
            } catch (err) {
              failures++;
              const row = { file, slug, title, category, visualBrief: brief, promptLength: prompt.length, width, height, status: 'failed', error: String(err), elapsedMs: Date.now() - started, model };
              manifest.push(row);
              fs.writeFileSync(path.join(resultDir, slug + '.json'), JSON.stringify(row, null, 2));
              console.error('FAILED ' + file + ': ' + row.error);
            }
          }

          const summary = {
            generatedAt: new Date().toISOString(),
            model, visualPlanner: 'v1', width, height, outputFormat: 'png', production,
            requested: selected.length, outputTiles, outputNeuronsPerTile, estimatedNeuronsPerImage,
            estimatedBatchNeurons: selected.length * estimatedNeuronsPerImage,
            freeDailyNeurons: 10000,
            estimatedImagesWithinFreeDailyAllocation: Math.floor(10000 / estimatedNeuronsPerImage),
            succeeded: manifest.filter(x => x.status === 'success').length,
            failed: failures, images: manifest
          };
          fs.writeFileSync('flux-backfill/manifest.json', JSON.stringify(summary, null, 2) + '\n');

          if (production && failures === 0) {
            const articlesTsPath = 'lib/articles.ts';
            let articlesTs = fs.readFileSync(articlesTsPath, 'utf8');
            for (const row of manifest.filter(x => x.status === 'success')) {
              const articlePath = path.join(articleDir, row.file);
              const outputPath = path.join(outDir, row.output);
              const productionPath = path.join('public/images/articles', row.output);
              fs.copyFileSync(outputPath, productionPath);

              let raw = fs.readFileSync(articlePath, 'utf8');
              const separator = raw.indexOf('---', 3);
              if (separator < 0) throw new Error('invalid frontmatter: ' + row.file);
              const front = raw.slice(3, separator).trim();
              const body = raw.slice(separator + 3);
              const lines = front.split(/\r?\n/).filter(Boolean);
              const values = {
                image: '/Trendforge/images/articles/' + row.output,
                imageAlt: 'Editorial image for ' + row.title,
                imageSource: 'Cloudflare Workers AI — FLUX.1 Schnell',
                imageLicense: 'Model-generated',
                imageGeneratedBy: 'Cloudflare FLUX.1 Schnell'
              };
              for (const [key, value] of Object.entries(values)) {
                const line = key + ': "' + yamlEscape(value) + '"';
                const index = lines.findIndex(x => x.startsWith(key + ':'));
                if (index >= 0) lines[index] = line;
                else lines.push(line);
              }
              fs.writeFileSync(articlePath, '---\n' + lines.join('\n') + '\n---' + body);

              const startMarker = '  {\n    "slug": "' + row.slug + '",';
              const objectStart = articlesTs.indexOf(startMarker);
              if (objectStart < 0) throw new Error('slug not found in lib/articles.ts: ' + row.slug);
              const objectEnd = articlesTs.indexOf('\n  },', objectStart);
              if (objectEnd < 0) throw new Error('article object end not found in lib/articles.ts: ' + row.slug);
              let articleObject = articlesTs.slice(objectStart, objectEnd + 5);
              const setField = (key, value) => {
                const pattern = new RegExp('    "' + key + '": .*');
                const line = '    "' + key + '": ' + JSON.stringify(value) + ',';
                if (!pattern.test(articleObject)) throw new Error('field not found in lib/articles.ts: ' + key + ' / ' + row.slug);
                articleObject = articleObject.replace(pattern, line);
              };
              setField('image', '/Trendforge/images/articles/' + row.output);
              setField('imageAlt', 'Editorial image for ' + row.title);
              setField('imageSource', 'Cloudflare Workers AI — FLUX.1 Schnell');
              setField('imageLicense', 'Model-generated');
              setField('imageGeneratedBy', 'Cloudflare FLUX.1 Schnell');
              articlesTs = articlesTs.slice(0, objectStart) + articleObject + articlesTs.slice(objectEnd + 5);
            }
            fs.writeFileSync(articlesTsPath, articlesTs);
          }

          if (failures > 0) process.exitCode = 1;
          NODE

      - name: Upload FLUX.1 Schnell backfill artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-flux-1-schnell-1024x576-backfill
          path: flux-backfill/
          if-no-files-found: error
          retention-days: 14

      - name: Promote validated images to production
        if: ${{ env.PRODUCTION == 'true' && success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles lib/articles.ts public/images/articles flux-backfill/manifest.json
          git status --short
          git commit -m "feat(images): promote FLUX.1 Schnell 1024x576 PNG article images" || echo "No changes to commit"
          git push
