name: TrendForge — Klein 4B 1024x576 PNG Article Image Test

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of article images to generate (0 = all)"
        required: false
        default: "3"
        type: string
      production:
        description: "Promote validated images into production article assets (keep false for testing)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
      WIDTH: "1024"
      HEIGHT: "576"
      OUTPUT_FORMAT: "png"
      OUTPUT_NEURONS_PER_TILE: "26.05"
      INPUT_NEURONS_PER_TILE: "5.37"
      LIMIT: ${{ inputs.limit }}
      PRODUCTION: ${{ inputs.production }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$MODEL" = "@cf/black-forest-labs/flux-2-klein-4b"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "576"
          test "$OUTPUT_FORMAT" = "png"
          mkdir -p klein-backfill/{images,results}
          echo "Model: $MODEL"
          echo "Dimensions: ${WIDTH}x${HEIGHT}"
          echo "Format: ${OUTPUT_FORMAT}"
          echo "Estimated output tiles: $(( (WIDTH + 511) / 512 * (HEIGHT + 511) / 512 ))"
          echo "Estimated output neurons/image: 104.20 (4 output tiles × 26.05)"
          echo "Limit: ${LIMIT:-0}"
          echo "Production promotion: $PRODUCTION"

      - name: Install image normalizer
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock sharp@0.35.4

      - name: Generate article-specific images
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const sharp = require('sharp');

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const model = process.env.MODEL;
          const width = Number(process.env.WIDTH);
          const height = Number(process.env.HEIGHT);
          const limit = Math.max(0, Number(process.env.LIMIT || 0));
          const production = process.env.PRODUCTION === 'true';
          const outputNeuronsPerTile = Number(process.env.OUTPUT_NEURONS_PER_TILE || 26.05);
          const inputNeuronsPerTile = Number(process.env.INPUT_NEURONS_PER_TILE || 5.37);
          const outputTilesX = Math.ceil(width / 512);
          const outputTilesY = Math.ceil(height / 512);
          const outputTiles = outputTilesX * outputTilesY;
          const estimatedOutputNeurons = outputTiles * outputNeuronsPerTile;
          const estimatedInputNeurons = 0; // text-only request; no reference image is sent
          const estimatedNeuronsPerImage = estimatedInputNeurons + estimatedOutputNeurons;
          const articleDir = 'content/articles';
          const outDir = 'klein-backfill/images';
          const resultDir = 'klein-backfill/results';

          const field = (text, key) => {
            const m = text.match(new RegExp('^' + key + ':\\s*"([\\s\\S]*?)"\\s*$', 'm'));
            return m ? m[1].replace(/\\\"/g, '"') : '';
          };

          const yamlEscape = value => value.replace(/\\/g, '\\\\').replace(/"/g, '\\\"').replace(/\r?\n/g, ' ');
          const slugify = value => value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 90);

          function buildPrompt(title, description, category) {
            return [
              'Create a premium editorial photograph that looks commissioned by a major technology publication, not an AI illustration.',
              'Canvas: exactly 1024x576 pixels, horizontal 16:9 composition.',
              'Use realistic editorial photography, natural lighting, believable materials and anatomy, restrained color, authentic depth of field, and a sophisticated technology-news magazine aesthetic.',
              'MINIMALISM IS A CORE RULE: build the image around one clear hero subject or visual idea. Use only one or two supporting elements when they directly explain the story. Remove anything that does not help communicate the story.',
              'Strong visual hierarchy: the subject should be immediately understandable at a glance. Prefer clean framing, breathing room, negative space, and an uncluttered background over busy scenes.',
              'Prefer a compelling physical object, device, machine, infrastructure, environment, or other tangible subject over generic people-in-an-office imagery.',
              'Do not fill the scene with multiple people, laptops, monitors, robots, props, decorative technology, city skylines, or unrelated objects. Avoid crowded compositions and visual clutter.',
              'Avoid generic AI imagery and technology clichés: no glowing holograms, floating code, circuit overlays, futuristic HUDs, neon sci-fi interfaces, fake dashboards, or decorative digital effects.',
              'When a specific real-world product is the subject of a review, launch, announcement, or comparison, prioritize visual fidelity to that product. Represent its known physical design, proportions, materials, distinctive hardware layout, camera arrangement, ports, buttons, controls, and finish as accurately as the available story context allows. Do not substitute a generic futuristic product.',
              'For specific products, keep the product as the single hero subject and use only minimal contextual elements. Do not invent unrelated features or redesign the product.',
              'If a recognizable brand or product name cannot be rendered accurately as text, do not fabricate readable branding. Preserve the product identity through its physical design rather than malformed lettering.',
              'When a specific person is central to the story, do not create a clearly identifiable face. Prefer documentary-style framing from behind, over-the-shoulder, side/back silhouette, cropped framing, hands, or a person naturally shown from a distance. The human should support the story, not become a generic office-scene cliché.',
              'ABSOLUTE READABLE-TEXT BAN: do not render article titles, summaries, captions, labels, signs, watermarks, subtitles, UI text, readable documents, fake headlines, or prominent intentional typography.',
              'Background screens, monitors, phones, posters, papers, signs, dashboards, and interfaces may exist only as naturally blurred, cropped, distant, or unreadable environmental details. They must never become a visual focal point.',
              'No title card, poster, presentation slide, giant text area, holographic typography, fake dashboard, or decorative lettering.',
              'Do not copy or spell words from article metadata into the image. Treat metadata only as semantic story context.',
              'Choose the simplest believable scene that communicates the article. When in doubt, simplify rather than add more objects, people, screens, effects, or visual detail.',
              'Do not reserve a large empty header band. Use the full 16:9 frame for the editorial scene; any headline overlay will be handled separately by the website.',
              'Semantic story context — NEVER reproduce as visible text: ' + title,
              'Category context: ' + category,
              'Story context — visualize the meaning, not the words: ' + description
            ].join('\\n');
          }

          function decodeImage(value) {
            if (typeof value !== 'string' || !value.trim()) throw new Error('missing result.image');
            const encoded = value.includes(',') ? value.slice(value.indexOf(',') + 1) : value;
            const bytes = Buffer.from(encoded, 'base64');
            if (bytes.length < 1000) throw new Error('decoded image unexpectedly small: ' + bytes.length);
            const isJpeg = bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff;
            const isPng = bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47;
            if (!isJpeg && !isPng) throw new Error('decoded payload is not JPEG/PNG');
            return { bytes, extension: isJpeg ? 'jpg' : 'png' };
          }

          const files = fs.readdirSync(articleDir)
            .filter(f => f.endsWith('.md'))
            .sort();

          const selected = limit > 0 ? files.slice(0, limit) : files;
          const manifest = [];
          let failures = 0;

          (async () => {
            for (const file of selected) {
              const raw = fs.readFileSync(path.join(articleDir, file), 'utf8');
              const title = field(raw, 'title');
              const description = field(raw, 'description');
              const category = field(raw, 'category') || 'Technology';
              const slug = field(raw, 'slug') || slugify(title) || file.replace(/\\.md$/, '');
              if (!title || !description) {
                failures++;
                manifest.push({ file, slug, status: 'failed', error: 'missing title or description' });
                continue;
              }

              const url = `https://api.cloudflare.com/client/v4/accounts/${account}/ai/run/${model}`;
              const form = new FormData();
              form.append('prompt', buildPrompt(title, description, category));
              form.append('width', String(width));
              form.append('height', String(height));

              const started = Date.now();
              try {
                const resp = await fetch(url, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${token}` },
                  body: form
                });
                const body = Buffer.from(await resp.arrayBuffer());
                const elapsedMs = Date.now() - started;
                if (!resp.ok) throw new Error(`HTTP ${resp.status}: ${body.toString('utf8').slice(0, 500)}`);

                const payload = JSON.parse(body.toString('utf8'));
                const decoded = decodeImage(payload?.result?.image);
                const rawMeta = await sharp(decoded.bytes).metadata();
                if (!rawMeta.width || !rawMeta.height) throw new Error('unable to read generated image dimensions');
                const normalized = await sharp(decoded.bytes)
                  .resize({ width, height, fit: 'cover', position: 'centre' })
                  .png({ compressionLevel: 9, adaptiveFiltering: true, palette: false })
                  .toBuffer();
                const finalMeta = await sharp(normalized).metadata();
                if (finalMeta.width !== width || finalMeta.height !== height) {
                  throw new Error(`normalized image dimensions are ${finalMeta.width}x${finalMeta.height}, expected ${width}x${height}`);
                }
                const outFile = `${slug}.1024x576.png`;
                fs.writeFileSync(path.join(outDir, outFile), normalized);

                const row = {
                  file, slug, title, category, width, height,
                  rawWidth: rawMeta.width, rawHeight: rawMeta.height,
                  status: 'success', output: outFile,
                  bytes: normalized.length, elapsedMs,
                  contentType: resp.headers.get('content-type'),
                  outputContentType: 'image/png',
                  outputTiles,
                  outputTilesX,
                  outputTilesY,
                  estimatedInputNeurons,
                  estimatedOutputNeurons,
                  estimatedNeuronsPerImage,
                  normalized: rawMeta.width !== width || rawMeta.height !== height,
                  model
                };
                manifest.push(row);
                fs.writeFileSync(path.join(resultDir, `${slug}.json`), JSON.stringify(row, null, 2));
                console.log(`SUCCESS ${file}: raw ${rawMeta.width}x${rawMeta.height} -> ${width}x${height}, ${normalized.length} bytes in ${elapsedMs}ms; estimated neurons=${estimatedNeuronsPerImage.toFixed(2)}`);
              } catch (err) {
                failures++;
                const row = { file, slug, title, category, width, height, status: 'failed', error: String(err), elapsedMs: Date.now() - started, model };
                manifest.push(row);
                fs.writeFileSync(path.join(resultDir, `${slug}.json`), JSON.stringify(row, null, 2));
                console.error(`FAILED ${file}: ${row.error}`);
              }
            }

            const summary = {
              generatedAt: new Date().toISOString(),
              model, width, height, outputFormat: 'png', production, requested: selected.length,
              outputTiles, outputNeuronsPerTile, estimatedNeuronsPerImage,
              estimatedBatchNeurons: selected.length * estimatedNeuronsPerImage,
              freeDailyNeurons: 10000,
              estimatedImagesWithinFreeDailyAllocation: Math.floor(10000 / estimatedNeuronsPerImage),
              succeeded: manifest.filter(x => x.status === 'success').length,
              failed: failures,
              images: manifest
            };
            fs.writeFileSync('klein-backfill/manifest.json', JSON.stringify(summary, null, 2) + '\\n');

            if (production && failures === 0) {
              const articlesTsPath = 'lib/articles.ts';
              let articlesTs = fs.readFileSync(articlesTsPath, 'utf8');

              for (const row of manifest.filter(x => x.status === 'success')) {
                const articlePath = path.join(articleDir, row.file);
                const outputPath = path.join(outDir, row.output);
                const productionPath = path.join('public/images/articles', row.output);
                fs.copyFileSync(outputPath, productionPath);

                let raw = fs.readFileSync(articlePath, 'utf8');
                const separator = raw.indexOf('---', 3);
                if (separator < 0) throw new Error('invalid frontmatter: ' + row.file);
                const front = raw.slice(3, separator).trim();
                const body = raw.slice(separator + 3);
                const lines = front.split(/\r?\n/).filter(Boolean);
                const values = {
                  image: '/Trendforge/images/articles/' + row.output,
                  imageAlt: 'Editorial image for ' + row.title,
                  imageSource: 'Cloudflare Workers AI — FLUX.2 Klein 4B',
                  imageLicense: 'Model-generated',
                  imageGeneratedBy: 'Cloudflare FLUX.2 Klein 4B'
                };
                for (const [key, value] of Object.entries(values)) {
                  const line = key + ': "' + yamlEscape(value) + '"';
                  const index = lines.findIndex(x => x.startsWith(key + ':'));
                  if (index >= 0) lines[index] = line;
                  else lines.push(line);
                }
                fs.writeFileSync(articlePath, '---\n' + lines.join('\n') + '\n---' + body);

                const startMarker = '  {\n    "slug": "' + row.slug + '",';
                const objectStart = articlesTs.indexOf(startMarker);
                if (objectStart < 0) throw new Error('slug not found in lib/articles.ts: ' + row.slug);
                const objectEnd = articlesTs.indexOf('\n  },', objectStart);
                if (objectEnd < 0) throw new Error('article object end not found in lib/articles.ts: ' + row.slug);
                let articleObject = articlesTs.slice(objectStart, objectEnd + 5);
                const setField = (key, value) => {
                  const pattern = new RegExp('    "' + key + '": .*');
                  const line = '    "' + key + '": ' + JSON.stringify(value) + ',';
                  if (!pattern.test(articleObject)) throw new Error('field not found in lib/articles.ts: ' + key + ' / ' + row.slug);
                  articleObject = articleObject.replace(pattern, line);
                };
                setField('image', '/Trendforge/images/articles/' + row.output);
                setField('imageAlt', 'Editorial image for ' + row.title);
                setField('imageSource', 'Cloudflare Workers AI — FLUX.2 Klein 4B');
                setField('imageLicense', 'Model-generated');
                setField('imageGeneratedBy', 'Cloudflare FLUX.2 Klein 4B');
                articlesTs = articlesTs.slice(0, objectStart) + articleObject + articlesTs.slice(objectEnd + 5);
              }

              fs.writeFileSync(articlesTsPath, articlesTs);
            }

            if (failures > 0) process.exitCode = 1;
          })().catch(err => { console.error(err); process.exitCode = 1; });
          NODE

      - name: Upload Klein 4B benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-klein-4b-1024x576-backfill
          path: klein-backfill/
          if-no-files-found: error
          retention-days: 14

      - name: Promote validated images to production
        if: ${{ inputs.production && success() }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles lib/articles.ts public/images/articles klein-backfill/manifest.json
          git status --short
          git commit -m "feat(images): promote Klein 4B 1024x576 PNG article images" || echo "No changes to commit"
          git push
