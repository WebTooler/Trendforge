name: Evidence V3 Lab — P1 Evidence Coverage Test

on:
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab branch
        uses: actions/checkout@v4
        with:
          ref: evidence-v3-lab
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run P1 deterministic coverage test
        run: node scripts/test-evidence-coverage.mjs
