name: TrendForge Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish.yml'
      - 'scripts/trend-research.mjs'
      - 'scripts/score-trends.ts'
      - 'scripts/trend-decision-engine.mjs'
      - 'scripts/verify-trend-sources.mjs'
      - 'scripts/recover-publisher-links.mjs'
      - 'scripts/evidence-integrity-preflight.mjs'
      - 'scripts/verify-article-claims.mjs'
      - 'scripts/verify-article-claims-v2.mjs'
      - 'scripts/verify-article-claims-smart.mjs'
      - 'scripts/test-claim-verifier-deterministic.mjs'
      - 'scripts/repair-article-grounding.mjs'
      - 'scripts/editorial-intelligence.mjs'
      - 'scripts/article-lifecycle.mjs'
      - 'scripts/growth-intelligence.mjs'
      - 'scripts/distribution-intelligence.mjs'
      - 'scripts/monetization-check.mjs'
      - 'scripts/v2-self-check.mjs'
      - 'scripts/ai-provider-router.mjs'
      - 'scripts/trendforge-writer-engine.mjs'
      - 'scripts/prepare-writer-runtime.mjs'
      - 'scripts/trendforge-editorial-policy.mjs'
      - 'scripts/validate-writer-output.mjs'
      - 'scripts/generate-article.ts'
      - 'scripts/generate-article-adaptive.mjs'
      - 'scripts/generate-article-image.ts'
      - 'scripts/validate-article-assets.ts'
      - 'scripts/validate-article-quality.ts'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: trendforge-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  COHERE_MODEL: ${{ vars.COHERE_MODEL }}

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Prepare writer runtime
        run: node scripts/prepare-writer-runtime.mjs
      - name: Research fresh trends
        run: node scripts/trend-research.mjs
      - name: Score trends
        run: npx tsx scripts/score-trends.ts
      - name: Verify trend sources
        run: node scripts/verify-trend-sources.mjs
      - name: Recover publisher links
        run: node scripts/recover-publisher-links.mjs
      - name: Evidence integrity preflight
        run: node scripts/evidence-integrity-preflight.mjs
      - name: AI provider state check
        run: node scripts/ai-provider-router.mjs
      - name: Deterministic Claim Verifier fixtures
        run: node scripts/test-claim-verifier-deterministic.mjs
      - name: Generate article
        run: node scripts/generate-article-adaptive.mjs
      - name: Archive generated article attempts
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p data/article-attempts
          found=0
          while IFS= read -r article; do
            [ -f "$article" ] || continue
            found=1
            stamp="$(date -u +%Y%m%d-%H%M%S)"
            name="$(basename "$article" .md)"
            dir="data/article-attempts/${stamp}-${name}"
            suffix=1
            while [ -e "$dir" ]; do dir="${dir}-${suffix}"; suffix=$((suffix + 1)); done
            mkdir -p "$dir"
            cp "$article" "$dir/article.md"
            if [ -f data/article-brief.json ]; then cp data/article-brief.json "$dir/article-brief.json"; fi
            if [ -f data/decision-queue.json ]; then cp data/decision-queue.json "$dir/decision-queue.json"; fi
            cat > "$dir/metadata.json" <<EOF
          {"archivedAt":"$(date -u +%Y-%m-%dT%H:%M:%SZ)","status":"generated-pending-verification","articleFile":"$(basename "$article")","articlePath":"$article","workflowRun":"${GITHUB_RUN_ID:-unknown}","workflowSha":"${GITHUB_SHA:-unknown}"}
          EOF
            echo "Archived generated article attempt: $dir"
          done < <(git status --porcelain --untracked-files=all -- content/articles | sed -n 's/^?? //p')
          if [ "$found" -eq 0 ]; then echo 'No newly generated article detected for attempt archive.'; fi
      - name: Validate Writer Engine output
        run: node scripts/validate-writer-output.mjs
      - name: Verify article claims
        id: claim_verification
        continue-on-error: true
        run: node scripts/verify-article-claims-v2.mjs
      - name: Repair grounded article
        id: grounding_repair_1
        if: steps.claim_verification.outcome == 'failure'
        run: node scripts/repair-article-grounding.mjs
      - name: Re-verify repaired article claims
        id: claim_reverification_1
        if: steps.claim_verification.outcome == 'failure' && steps.grounding_repair_1.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-article-claims-v2.mjs
      - name: Second surgical grounding repair
        id: grounding_repair_2
        if: steps.claim_verification.outcome == 'failure' && steps.claim_reverification_1.outcome != 'success'
        run: node scripts/repair-article-grounding.mjs
      - name: Final claim verification
        id: claim_verification_final
        if: steps.claim_verification.outcome == 'failure' && steps.claim_reverification_1.outcome != 'success' && steps.grounding_repair_2.outcome == 'success'
        continue-on-error: true
        run: node scripts/verify-article-claims-v2.mjs
      - name: Claim verification gate
        if: ${{ !cancelled() && steps.claim_verification.outcome != 'success' && steps.claim_reverification_1.outcome != 'success' && steps.claim_verification_final.outcome != 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Claim verification gate: BLOCK — all bounded verification paths exhausted (initial=${{ steps.claim_verification.outcome }} repair1=${{ steps.grounding_repair_1.outcome }} reverify1=${{ steps.claim_reverification_1.outcome }} repair2=${{ steps.grounding_repair_2.outcome }} final=${{ steps.claim_verification_final.outcome }})."
          mkdir -p data/article-attempts
          article="$(git status --porcelain --untracked-files=all -- content/articles | sed -n 's/^?? //p' | head -n 1)"
          if [ -n "$article" ] && [ -f "$article" ]; then
            stamp="$(date -u +%Y%m%d-%H%M%S)"
            name="$(basename "$article" .md)"
            quarantine="data/article-attempts/${stamp}-${name}-claim-blocked"
            mkdir -p "$quarantine"
            cp "$article" "$quarantine/article.md"
            [ -f data/article-brief.json ] && cp data/article-brief.json "$quarantine/article-brief.json"
            [ -f data/claim-verification.json ] && cp data/claim-verification.json "$quarantine/claim-verification.json"
            [ -f data/grounding-repair.json ] && cp data/grounding-repair.json "$quarantine/grounding-repair.json"
            cat > "$quarantine/metadata.json" <<EOF
          {"status":"claim-verification-blocked","workflowRun":"${GITHUB_RUN_ID:-unknown}","workflowSha":"${GITHUB_SHA:-unknown}","reason":"Bounded claim verification did not reach PASS; generated article quarantined and will not be published."}
          EOF
            rm -f "$article"
            echo "Claim verification: generated article quarantined and removed from publication set: $quarantine"
          else
            echo 'Claim verification: no newly generated article found to quarantine.'
          fi
          printf '%s\n' '{"status":"blocked","action":"quarantined","publishable":false}' > data/current-article-rejected.json
          echo 'Claim verification gate: NON-FATAL BLOCK — pipeline will continue with no newly generated article.'
      - name: Claim verification gate pass
        if: ${{ !cancelled() && (steps.claim_verification.outcome == 'success' || steps.claim_reverification_1.outcome == 'success' || steps.claim_verification_final.outcome == 'success') }}
        run: |
          echo "Claim verification gate: PASS — at least one bounded claim-verification attempt completed successfully (initial=${{ steps.claim_verification.outcome }} reverify1=${{ steps.claim_reverification_1.outcome }} final=${{ steps.claim_verification_final.outcome }})."
      - name: Upload article attempt diagnostics
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-article-attempt-${{ github.run_number }}
          path: |
            data/article-attempts/
            data/article-brief.json
            data/claim-verification.json
            data/grounding-repair.json
            data/evidence-integrity.json
            data/current-article-rejected.json
          if-no-files-found: warn
          retention-days: 14
      - name: Editorial intelligence gate
        run: node scripts/editorial-intelligence.mjs
      - name: Validate content quality gate
        run: npx tsx scripts/validate-article-quality.ts
      - name: Generate article-specific images
        run: npx tsx scripts/generate-article-image.ts
      - name: Validate article image safety gate
        run: npx tsx scripts/validate-article-assets.ts
      - name: Sync published articles into site
        run: npx tsx scripts/sync-articles.ts
      - name: Article lifecycle intelligence
        run: node scripts/article-lifecycle.mjs
      - name: Growth intelligence
        run: node scripts/growth-intelligence.mjs
      - name: Distribution intelligence
        run: node scripts/distribution-intelligence.mjs
      - name: Monetization readiness
        run: node scripts/monetization-check.mjs
      - name: V2 self-check
        run: node scripts/v2-self-check.mjs
      - name: Validate centralized SEO
        run: npx tsx scripts/validate-seo.ts
      - name: Build site
        run: npm run build
      - name: Commit pipeline output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendforge-bot'
          git config user.email 'trendforge-bot@users.noreply.github.com'
          git restore --worktree --staged next-env.d.ts package-lock.json 2>/dev/null || true
          rm -rf .next out node_modules
          git add data lib/articles.ts public/images/articles
          if [ -d content/articles ]; then git add content/articles; fi
          echo '--- staged changes ---'
          git status --short
          if git diff --cached --quiet; then echo 'No pipeline output changes to commit.'; exit 0; fi
          git commit -m 'chore: update TrendForge content pipeline'
          if ! git diff --quiet || ! git diff --cached --quiet; then git reset --hard HEAD; fi
          output_commit="$(git rev-parse HEAD)"
          git fetch origin main
          git reset --hard origin/main
          generated_files="$(git diff-tree --no-commit-id --name-only -r "$output_commit" -- data lib/articles.ts public/images/articles content/articles 2>/dev/null || true)"
          if [ -z "$generated_files" ]; then echo 'No generated output paths found in pipeline commit.'; exit 0; fi
          while IFS= read -r path; do [ -z "$path" ] && continue; git checkout "$output_commit" -- "$path"; done <<< "$generated_files"
          git add $generated_files
          if git diff --cached --quiet; then echo 'Generated output is already present on main.'; exit 0; fi
          git commit -m 'chore: update TrendForge content pipeline'
          git push origin HEAD:main
          echo 'Pipeline output pushed successfully without rebasing source commits.'
