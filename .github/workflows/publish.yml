name: TrendForge Pipeline

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/trend-research.mjs'
      - 'scripts/generate-article.ts'
      - 'scripts/generate-article-image.ts'
      - 'scripts/validate-article-assets.ts'
  schedule:
    - cron: '17 */6 * * *'

concurrency:
  group: trendforge-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Research fresh trends
        run: node scripts/trend-research.mjs
      - name: Score trends
        run: npx tsx scripts/score-trends.ts
      - name: AI provider health check
        run: |
          node --input-type=module <<'NODE'
          const prompt = 'Return ONLY valid JSON with exactly one key named ok. Its value must be true.';
          async function call(name, fn) {
            try {
              const text = await fn();
              const parsed = JSON.parse(text.replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/i,'').trim());
              if (parsed.ok !== true) throw new Error('invalid JSON response');
              console.log(`AI provider health: ${name} PASS`);
              return true;
            } catch (e) {
              console.log(`AI provider health: ${name} FAIL - ${e?.message || e}`);
              return false;
            }
          }
          const results = [];
          if (process.env.GROQ_API_KEY) results.push(await call('Groq', async () => {
            const r = await fetch('https://api.groq.com/openai/v1/chat/completions', {
              method:'POST', headers:{Authorization:`Bearer ${process.env.GROQ_API_KEY}`,'Content-Type':'application/json'},
              body:JSON.stringify({model:process.env.GROQ_MODEL||'openai/gpt-oss-20b',max_completion_tokens:300,response_format:{type:'json_object'},messages:[{role:'user',content:prompt}]})
            }); if(!r.ok) throw new Error(`${r.status}: ${(await r.text()).slice(0,300)}`);
            return (await r.json()).choices?.[0]?.message?.content || '';
          }));
          if (process.env.GEMINI_API_KEY) results.push(await call('Gemini', async () => {
            const model=process.env.GEMINI_MODEL||'gemini-3.6-flash';
            const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`,{method:'POST',headers:{'x-goog-api-key':process.env.GEMINI_API_KEY,'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:'application/json'}})});
            if(!r.ok) throw new Error(`${r.status}: ${(await r.text()).slice(0,300)}`);
            return (await r.json()).candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('') || '';
          }));
          if (!results.some(Boolean)) { console.log('No AI provider health check could run.'); process.exit(1); }
          NODE
      - name: Generate article
        run: npx tsx scripts/generate-article.ts
      - name: Validate content quality gate
        run: npx tsx scripts/validate-article-quality.ts
      - name: Generate article-specific images
        run: npx tsx scripts/generate-article-image.ts
      - name: Validate article image safety gate
        run: npx tsx scripts/validate-article-assets.ts
      - name: Validate centralized SEO
        run: npx tsx scripts/validate-seo.ts
      - name: Sync published articles into site
        run: npx tsx scripts/sync-articles.ts
      - name: Build site
        run: npm run build
      - name: Commit pipeline output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'trendforge-bot'
          git config user.email 'trendforge-bot@users.noreply.github.com'
          git fetch origin main
          git rebase origin/main
          git add data lib/articles.ts public/images/articles
          if [ -d content/articles ]; then git add content/articles; fi
          echo '--- staged changes ---'
          git status --short
          if git diff --cached --quiet; then
            echo 'No pipeline output changes to commit.'
            exit 0
          fi
          git commit -m 'chore: update TrendForge content pipeline'
          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then exit 0; fi
            else
              git rebase --abort || true
              git pull --rebase --autostash origin main
              if git push origin HEAD:main; then exit 0; fi
            fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 5)); fi
          done
          echo 'Unable to push pipeline output after 3 attempts.'
          exit 1
