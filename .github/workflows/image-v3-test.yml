name: TrendForge Image V3 Test Lab

on:
  push:
    branches:
      - image-v3-test-lab
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_IMAGE_MODEL: '@cf/black-forest-labs/flux-2-klein-9b'

jobs:
  image-v3-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Generate one real article image only
        run: npx --yes tsx scripts/generate-article-image-v3-article-test.ts
      - name: Upload isolated image test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-image-v3-article-test-${{ github.run_number }}
          path: data/image-v3-test/
          if-no-files-found: warn
          retention-days: 14
