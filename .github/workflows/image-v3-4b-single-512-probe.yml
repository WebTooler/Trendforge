name: TrendForge — Klein 4B Single 512 Probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MODEL: '@cf/black-forest-labs/flux-2-klein-4b'
    steps:
      - name: Preflight
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$MODEL" = '@cf/black-forest-labs/flux-2-klein-4b'
          echo "Single-request probe armed."
          echo "Model: $MODEL"
          echo "Dimensions: 512x512"
          echo "Requests: exactly 1"
          echo "Retries: 0"
          echo "Production writes: none"

      - name: Run exactly one 512x512 inference
        run: |
          set -euo pipefail
          mkdir -p probe-output
          node <<'NODE'
          const fs = require('fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const model = process.env.MODEL;
          const url = `https://api.cloudflare.com/client/v4/accounts/${account}/ai/run/${model}`;

          const form = new FormData();
          form.append('prompt', 'A single polished editorial technology illustration of a modern enterprise AI server rack in a clean data center, realistic materials, natural cinematic lighting, no people, no logos, no readable text.');
          form.append('width', '512');
          form.append('height', '512');

          const started = Date.now();
          fetch(url, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: form
          }).then(async (resp) => {
            const bytes = Buffer.from(await resp.arrayBuffer());
            const elapsed = Date.now() - started;
            fs.writeFileSync('probe-output/response.bin', bytes);
            fs.writeFileSync('probe-output/result.json', JSON.stringify({
              model, width: 512, height: 512, httpStatus: resp.status,
              elapsedMs: elapsed, responseBytes: bytes.length,
              contentType: resp.headers.get('content-type')
            }, null, 2));

            console.log(`HTTP ${resp.status} after ${elapsed}ms; bytes=${bytes.length}`);
            if (!resp.ok) {
              console.log(bytes.toString('utf8'));
              process.exitCode = 1;
              return;
            }

            const ct = (resp.headers.get('content-type') || '').toLowerCase();

            // Workers AI FLUX.2 [klein] returns the generated image as a
            // base64 string inside a JSON result envelope, not necessarily as
            // a raw image/* HTTP response. Accept both forms so the probe
            // validates the actual generated image rather than only its MIME type.
            let imageBytes = bytes;
            let outputExtension = 'bin';

            if (ct.includes('application/json')) {
              let payload;
              try {
                payload = JSON.parse(bytes.toString('utf8'));
              } catch (err) {
                console.error('FAIL: Cloudflare returned JSON content-type but the body was not valid JSON.');
                console.error(err);
                process.exitCode = 1;
                return;
              }

              const imageValue = payload?.result?.image ?? payload?.result;
              if (typeof imageValue !== 'string' || !imageValue.trim()) {
                console.error('FAIL: Cloudflare JSON response did not contain result.image.');
                console.log(bytes.toString('utf8'));
                process.exitCode = 1;
                return;
              }

              const encoded = imageValue.includes(',')
                ? imageValue.slice(imageValue.indexOf(',') + 1)
                : imageValue;
              imageBytes = Buffer.from(encoded, 'base64');
            } else if (!ct.includes('image/')) {
              console.error(`FAIL: unexpected response content-type: ${ct || '(missing)'}`);
              console.log(bytes.toString('utf8'));
              process.exitCode = 1;
              return;
            }

            if (imageBytes.length < 100) {
              console.error(`FAIL: decoded image payload is unexpectedly small: ${imageBytes.length} bytes`);
              process.exitCode = 1;
              return;
            }

            // Validate common image signatures before declaring the probe successful.
            const isJpeg = imageBytes[0] === 0xff && imageBytes[1] === 0xd8 && imageBytes[2] === 0xff;
            const isPng = imageBytes[0] === 0x89 && imageBytes[1] === 0x50 &&
              imageBytes[2] === 0x4e && imageBytes[3] === 0x47;
            if (isJpeg) outputExtension = 'jpg';
            else if (isPng) outputExtension = 'png';
            else {
              console.error('FAIL: decoded payload is not a recognized JPEG or PNG image.');
              process.exitCode = 1;
              return;
            }

            fs.writeFileSync(`probe-output/klein-4b-512.${outputExtension}`, imageBytes);
            console.log(`SUCCESS: one image returned and decoded (${imageBytes.length} bytes; ${outputExtension}).`);
          }).catch((err) => {
            fs.writeFileSync('probe-output/result.json', JSON.stringify({ model, width: 512, height: 512, error: String(err) }, null, 2));
            console.error(err);
            process.exitCode = 1;
          });
          NODE

      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-klein-4b-single-512-probe
          path: probe-output/
          if-no-files-found: warn

      - name: Probe summary
        if: always()
        run: |
          echo "Model: $MODEL"
          echo "Dimensions: 512x512"
          echo "Exactly one inference request attempted"
          echo "No retry"
          echo "No production promotion"
