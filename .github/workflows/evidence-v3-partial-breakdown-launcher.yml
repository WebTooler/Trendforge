name: Evidence V3 — Partial Verification Breakdown Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lab
        uses: actions/checkout@v7
        with:
          ref: evidence-v3-lab
          fetch-depth: 1
      - name: Run lab breakdown workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run "Evidence V3 — Partial Verification Breakdown"             --repo "${{ github.repository }}"             --ref evidence-v3-lab
          echo "Triggered lab workflow: Evidence V3 — Partial Verification Breakdown"
