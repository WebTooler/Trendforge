name: TrendForge Writer Capability Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-capability:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-luna
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Verify research evidence is fresh
        run: |
          node -e "const fs=require('fs'); for(const p of ['data/decision-queue.json','data/source-verification.json']){if(!fs.existsSync(p))throw new Error('Missing '+p)}; console.log('Fresh evidence files present.');"
      - name: Run isolated Writer Engine capability test
        run: node scripts/test-writer-capability.mjs
      - name: Upload writer proof
        if: always() && hashFiles('writer-capability-result.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: writer-capability-proof
          path: writer-capability-result.json
