name: Evidence V3 — Source Qualification Smoke

on:
  push:
    branches:
      - evidence-v3-lab
    paths:
      - 'scripts/verify-trend-sources.mjs'
      - 'scripts/trend-research.mjs'
      - 'scripts/score-trends.ts'
      - '.github/workflows/evidence-v3-source-qualification-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: evidence-v3-lab
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - name: Refresh trend research
        run: node scripts/trend-research.mjs
      - name: Score fresh candidates
        run: npx tsx scripts/score-trends.ts
      - name: Verify and discover publisher sources
        run: node scripts/verify-trend-sources.mjs
      - name: Validate discovery accounting
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const {records=[]}=JSON.parse(fs.readFileSync('data/source-verification.json','utf8'));
          let bad=0;
          for(const r of records){
            const d=r.discovery?.diagnostics;
            if(!d) continue;
            if(d.selected > d.relevantItems || d.discardedNoChosenCandidate > d.relevantItems || d.selected + d.discardedNoChosenCandidate > d.relevantItems){
              console.error('Invalid item accounting:', r.title, JSON.stringify(d));
              bad++;
            }
            if(d.resolvedCandidateUrls<0 || d.unresolvedCandidateUrls<0){
              console.error('Invalid resolution counters:', r.title, JSON.stringify(d));
              bad++;
            }
          }
          if(bad) process.exit(1);
          console.log('Discovery accounting invariant: PASS');
          NODE
      - name: Report qualification diagnostics
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const {records=[]}=JSON.parse(fs.readFileSync('data/source-verification.json','utf8'));
          const numericKeys=['relevantItems','resolvedCandidateUrls','unresolvedCandidateUrls','discardedSeedFamily','discardedLowOverlap','discardedHomepageOrFeed','discardedEmptyLinkText','discardedNoChosenCandidate','selected'];
          const d=records.reduce((a,r)=>{
            const x=r.discovery?.diagnostics;
            if(!x) return a;
            for(const k of numericKeys) a[k]+=Number(x[k]||0);
            a.seedFamilyOnlyNoChoice+=Number(x.seedFamilyOnlyNoChoice||0);
            a.mixedRejectionNoChoice+=Number(x.mixedRejectionNoChoice||0);
            return a;
          },Object.fromEntries([...numericKeys,'seedFamilyOnlyNoChoice','mixedRejectionNoChoice'].map(k=>[k,0])));
          const noChosenReasonCounts=records.reduce((a,r)=>{ const x=r.discovery?.diagnostics?.noChosenReasonCounts||{}; for(const [k,v] of Object.entries(x)) a[k]=(a[k]||0)+Number(v||0); return a; },{});
          const seedFamilyRejectionDomains=records.reduce((a,r)=>{ const x=r.discovery?.diagnostics?.seedFamilyRejectionDomains||{}; for(const [k,v] of Object.entries(x)) a[k]=(a[k]||0)+Number(v||0); return a; },{});
          const topSeedFamilyRejections=Object.entries(seedFamilyRejectionDomains).sort((a,b)=>b[1]-a[1]).slice(0,30);
          const familySaturation=records.reduce((a,r)=>{
            const x=r.discovery?.diagnostics||{};
            a.candidatesWithDiscovery+=x.relevantItems?1:0;
            a.relevantItems+=Number(x.relevantItems||0);
            a.publisherFamilyItems+=Number(x.relevantItemPublisherFamilyItems||0);
            a.seedFamilyItems+=Number(x.relevantItemSeedFamilyItems||0);
            a.nonSeedFamilyItems+=Number(x.relevantItemNonSeedFamilyItems||0);
            a.uniqueFamilyTotal+=Number(x.relevantItemUniquePublisherFamilies||0);
            a.maxTopFamilyShare=Math.max(a.maxTopFamilyShare,Number(x.relevantItemTopFamilyShare||0));
            return a;
          },{candidatesWithDiscovery:0,relevantItems:0,publisherFamilyItems:0,seedFamilyItems:0,nonSeedFamilyItems:0,uniqueFamilyTotal:0,maxTopFamilyShare:0});
          familySaturation.avgUniqueFamiliesPerCandidate=familySaturation.candidatesWithDiscovery?familySaturation.uniqueFamilyTotal/familySaturation.candidatesWithDiscovery:0;
          familySaturation.seedFamilyItemShare=familySaturation.publisherFamilyItems?familySaturation.seedFamilyItems/familySaturation.publisherFamilyItems:0;
          familySaturation.nonSeedFamilyItemShare=familySaturation.publisherFamilyItems?familySaturation.nonSeedFamilyItems/familySaturation.publisherFamilyItems:0;
          const noChosenSamples=records.flatMap(r=>(r.discovery?.diagnostics?.noChosenSamples||[]).map(s=>({...s,title:s.title||r.title}))).slice(0,25);
          const familyLift=records.reduce((a,r)=>{
            const seedFamilies=new Set((r.sources||[]).filter(s=>!s.discovered).map(s=>s.publisherFamily).filter(Boolean));
            const discoveredFamilies=new Set((r.sources||[]).filter(s=>s.discovered).map(s=>s.publisherFamily).filter(Boolean));
            const finalFamilies=new Set((r.independentPublisherFamilies||[]).filter(Boolean));
            const newlyAdded=[...discoveredFamilies].filter(f=>!seedFamilies.has(f)&&finalFamilies.has(f));
            if(finalFamilies.size>=2) a.multiFamily++;
            if(finalFamilies.size===1) a.singleFamily++;
            if(finalFamilies.size===0) a.zeroFamily++;
            if(newlyAdded.length>0) a.discoveryAddedFamily++;
            a.discoveryAddedFamilyCount+=newlyAdded.length;
            return a;
          },{multiFamily:0,singleFamily:0,zeroFamily:0,discoveryAddedFamily:0,discoveryAddedFamilyCount:0});
          const discoveryLiftSamples=records.flatMap(r=>{
            const seedFamilies=new Set((r.sources||[]).filter(s=>!s.discovered).map(s=>s.publisherFamily).filter(Boolean));
            const discoveredFamilies=new Set((r.sources||[]).filter(s=>s.discovered).map(s=>s.publisherFamily).filter(Boolean));
            const finalFamilies=new Set((r.independentPublisherFamilies||[]).filter(Boolean));
            const newlyAdded=[...discoveredFamilies].filter(f=>!seedFamilies.has(f)&&finalFamilies.has(f));
            if(!newlyAdded.length) return [];
            return [{title:r.title,category:r.category,seedFamilies:[...seedFamilies],newlyAddedFamilies:newlyAdded,finalFamilies:[...finalFamilies],status:r.status,credible:Number(r.credibleSourceCount||0),reachable:Number(r.reachableSourceCount||0),discovered:Number(r.discoveredSourceCount||0),discoveredSources:(r.sources||[]).filter(s=>s.discovered&&newlyAdded.includes(s.publisherFamily)).map(s=>({domain:s.domain,publisherFamily:s.publisherFamily,title:s.title,overlap:s.relevanceOverlap,ok:s.ok}))}];
          }).slice(0,30);
          const credibilityTierCounts=records.reduce((a,r)=>{ const x=r.credibilityTierCounts||{}; for(const k of ['trusted','recognized','unknown']) a[k]+=Number(x[k]||0); return a; },{trusted:0,recognized:0,unknown:0});
          const unknownDomains=records.reduce((a,r)=>{ for(const d of (r.unknownReachableDomains||[])) a[d]=(a[d]||0)+1; return a; },{});
          const topUnknownDomains=Object.entries(unknownDomains).sort((a,b)=>b[1]-a[1]).slice(0,40);
          console.log('CREDIBILITY TIER COUNTS',JSON.stringify(credibilityTierCounts));
          console.log('TOP UNKNOWN REACHABLE DOMAINS',JSON.stringify(topUnknownDomains));
          console.log('DISCOVERY FAMILY LIFT',JSON.stringify(familyLift));
          console.log('DISCOVERY FAMILY SATURATION',JSON.stringify(familySaturation));
          console.log('DISCOVERY LIFT SAMPLES',JSON.stringify(discoveryLiftSamples,null,2));
          console.log('NO-CHOSEN REASON COUNTS',JSON.stringify(noChosenReasonCounts));
          console.log('SEED-FAMILY REJECTION OUTCOMES',JSON.stringify({seedFamilyOnlyNoChoice:d.seedFamilyOnlyNoChoice||0,mixedRejectionNoChoice:d.mixedRejectionNoChoice||0}));
          console.log('TOP SEED-FAMILY REJECTION DOMAINS',JSON.stringify(topSeedFamilyRejections));
          console.log('NO-CHOSEN SAMPLES',JSON.stringify(noChosenSamples,null,2));
          console.log('QUALIFICATION DIAGNOSTICS');
          console.log(JSON.stringify(d,null,2));
          console.log('STATUS', JSON.stringify({
            candidates:records.length,
            verified:records.filter(r=>r.status==='verified').length,
            partial:records.filter(r=>r.status==='partial').length,
            unverified:records.filter(r=>r.status==='unverified').length,
            discovered:records.reduce((n,r)=>n+r.discoveredSourceCount,0)
          }));
          NODE
