name: TrendForge — Image Model Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WIDTH: "1024"
      HEIGHT: "576"
      OUTPUT_FORMAT: "png"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Preflight
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "576"
          echo "Controlled benchmark: 3 models × 1 fixed story = 3 images"
          echo "Production writes: NONE"
          echo "Visual Planner: story-first v1"
          echo "Quota guard: only 3 generation requests in this controlled run"

      - name: Install image normalizer
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock sharp@0.35.4

      - name: Generate benchmark matrix
        run: |
          set -euo pipefail
          mkdir -p model-benchmark/images model-benchmark/results
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import sharp from 'sharp';
          import { buildImagePrompt } from './scripts/trendforge-visual-planner.mjs';

          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const width = Number(process.env.WIDTH);
          const height = Number(process.env.HEIGHT);
          const models = [
            { id: 'klein-4b', api: '@cf/black-forest-labs/flux-2-klein-4b' },
            { id: 'flux-1-schnell', api: '@cf/black-forest-labs/flux-1-schnell' },
            { id: 'sdxl-lightning', api: '@cf/bytedance/stable-diffusion-xl-lightning' }
          ];
          const articleFiles = ['anthropic-s-ceo-calls-for-an-ai-slow-down-what-it-means-for-the-industry.md'];

          const field = (text, key) => {
            const m = text.match(new RegExp('^' + key + ':\\s*"([\\s\\S]*?)"\\s*$', 'm'));
            return m ? m[1].replace(/\\\"/g, '"') : '';
          };
          const slugify = value => value.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 90);

          function decodeBase64Image(value) {
            if (typeof value !== 'string' || !value.trim()) throw new Error('missing base64 image');
            const encoded = value.includes(',') ? value.slice(value.indexOf(',') + 1) : value;
            const bytes = Buffer.from(encoded, 'base64');
            if (bytes.length < 1000) throw new Error('decoded image unexpectedly small: ' + bytes.length);
            return bytes;
          }

          function isImage(bytes) {
            return (bytes[0] === 0xff && bytes[1] === 0xd8 && bytes[2] === 0xff) ||
              (bytes[0] === 0x89 && bytes[1] === 0x50 && bytes[2] === 0x4e && bytes[3] === 0x47);
          }

          async function readModelImage(modelId, resp) {
            const body = Buffer.from(await resp.arrayBuffer());
            if (!resp.ok) throw new Error('HTTP ' + resp.status + ': ' + body.toString('utf8').slice(0, 500));

            // SDXL-Lightning returns an image stream (JPEG in this run), not JSON.
            if (modelId === 'sdxl-lightning') {
              if (!isImage(body)) throw new Error('SDXL response is not JPEG/PNG');
              return { bytes: body, responseType: resp.headers.get('content-type') || 'image/*' };
            }

            // Klein 4B and FLUX.1 Schnell REST responses expose result.image as Base64.
            const payload = JSON.parse(body.toString('utf8'));
            const value = payload?.result?.image || payload?.image;
            const bytes = decodeBase64Image(value);
            if (!isImage(bytes)) throw new Error('decoded payload is not JPEG/PNG');
            return { bytes, responseType: resp.headers.get('content-type') || 'application/json' };
          }

          async function run() {
            const manifest = [];

            for (const file of articleFiles) {
              const raw = fs.readFileSync(path.join('content/articles', file), 'utf8');
              const title = field(raw, 'title');
              const description = field(raw, 'description');
              const category = field(raw, 'category') || 'Technology';
              const slug = field(raw, 'slug') || slugify(title) || file.replace(/\\.md$/, '');
              const planned = buildImagePrompt({ title, description, category, body: raw });
              const { brief, prompt } = planned;

              console.log('VISUAL BRIEF:', JSON.stringify(brief));
              console.log('PROMPT LENGTH:', prompt.length);

              for (const model of models) {
                const url = 'https://api.cloudflare.com/client/v4/accounts/' + account + '/ai/run/' + model.api;
                const started = Date.now();

                try {
                  let resp;
                  if (model.id === 'klein-4b') {
                    const form = new FormData();
                    form.append('prompt', prompt);
                    form.append('width', String(width));
                    form.append('height', String(height));
                    resp = await fetch(url, { method: 'POST', headers: { Authorization: 'Bearer ' + token }, body: form });
                  } else if (model.id === 'flux-1-schnell') {
                    resp = await fetch(url, {
                      method: 'POST',
                      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                      // FLUX.1 Schnell currently accepts prompt + steps; dimensions are not valid input fields.
                      // Output is normalized to the benchmark canvas after generation.
                      body: JSON.stringify({ prompt, steps: 4 })
                    });
                  } else {
                    resp = await fetch(url, {
                      method: 'POST',
                      headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/json' },
                      body: JSON.stringify({
                        prompt,
                        negative_prompt: 'readable text, fake headlines, logos, watermarks, generic AI art, holograms, floating code, HUD, neon sci-fi, clutter, distorted anatomy',
                        width,
                        height,
                        num_steps: 4
                      })
                    });
                  }

                  const result = await readModelImage(model.id, resp);
                  const elapsedMs = Date.now() - started;
                  const normalized = await sharp(result.bytes)
                    .resize({ width, height, fit: 'cover', position: 'centre' })
                    .png({ compressionLevel: 9, adaptiveFiltering: true, palette: false })
                    .toBuffer();
                  const meta = await sharp(normalized).metadata();
                  if (meta.width !== width || meta.height !== height) throw new Error('final dimensions ' + meta.width + 'x' + meta.height);

                  const outFile = slug + '__' + model.id + '.1024x576.png';
                  fs.writeFileSync(path.join('model-benchmark/images', outFile), normalized);

                  const row = {
                    file, slug, title, category, visualBrief: brief, promptLength: prompt.length,
                    model: model.api, status: 'success', width, height,
                    bytes: normalized.length, elapsedMs, responseType: result.responseType, output: outFile
                  };
                  manifest.push(row);
                  fs.writeFileSync(path.join('model-benchmark/results', slug + '__' + model.id + '.json'), JSON.stringify(row, null, 2));
                  console.log('SUCCESS [' + model.id + '] [' + brief.mode + '] ' + normalized.length + ' bytes in ' + elapsedMs + 'ms');
                } catch (err) {
                  const row = {
                    file, slug, title, category, visualBrief: brief, promptLength: prompt.length,
                    model: model.api, status: 'failed', error: String(err), elapsedMs: Date.now() - started
                  };
                  manifest.push(row);
                  fs.writeFileSync(path.join('model-benchmark/results', slug + '__' + model.id + '.json'), JSON.stringify(row, null, 2));
                  console.error('FAILED [' + model.id + '] ' + row.error);
                }
              }
            }

            const summary = {
              generatedAt: new Date().toISOString(),
              dimensions: width + 'x' + height,
              productionWrites: false,
              visualPlanner: 'v1',
              models: models.map(x => x.api),
              articles: articleFiles,
              total: manifest.length,
              succeeded: manifest.filter(x => x.status === 'success').length,
              failed: manifest.filter(x => x.status === 'failed').length,
              images: manifest
            };
            fs.writeFileSync('model-benchmark/manifest.json', JSON.stringify(summary, null, 2) + '\n');
            if (summary.failed > 0) process.exitCode = 1;
          }

          run().catch(err => { console.error(err); process.exitCode = 1; });
          NODE

      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trendforge-image-model-benchmark-1024x576
          path: model-benchmark/
          if-no-files-found: error
          retention-days: 14
