name: Cloudflare Writer Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/test-cloudflare-writer.mjs'
      - 'scripts/trendforge-writer-engine.mjs'
      - 'scripts/ai-provider-router.mjs'
      - '.github/workflows/cloudflare-writer-test.yml'

jobs:
  cloudflare-writer-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TRENDFORGE_PROVIDER_ONLY: Cloudflare
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_MODEL: ${{ vars.CLOUDFLARE_MODEL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Cloudflare-only writer smoke test
        run: node scripts/test-cloudflare-writer.mjs
