name: TrendForge Static Architecture Checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'

concurrency:
  group: trendforge-static-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            scripts/story-fact-map.mjs \
            scripts/editorial-evidence-brief.mjs \
            scripts/evidence-article-blueprint.mjs \
            scripts/evidence-coverage.mjs \
            scripts/pre-writer-pipeline.mjs \
            scripts/trendforge-writer-engine.mjs \
            scripts/verify-article-claims-smart.mjs \
            scripts/verify-article-claims-v2.mjs \
            scripts/repair-article-grounding.mjs \
            scripts/authoritative-evidence-pack.mjs \
            scripts/article-depth-guard.mjs \
            scripts/trendforge-editorial-policy.mjs \
            scripts/generate-article-adaptive.mjs
          do
            node --check "$file"
          done
      - name: Story Fact Map fixtures
        run: node scripts/test-story-fact-map.mjs
      - name: Editorial Evidence Brief fixtures
        run: node scripts/test-editorial-evidence-brief.mjs
      - name: Writer architecture fixtures
        run: node scripts/test-writer-architecture.mjs
      - name: TypeScript compile check
        run: npx tsc --noEmit --pretty false
