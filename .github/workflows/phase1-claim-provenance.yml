name: Phase 1 Reliability — Claim Provenance

on:
  push:
    branches:
      - fix/claim-verifier-phase0-baseline

permissions:
  contents: read

jobs:
  claim-provenance:
    name: Claim provenance deterministic test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run claim verifier deterministic tests
        run: npm run claims:deterministic
