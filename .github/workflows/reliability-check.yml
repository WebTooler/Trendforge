name: TrendForge Reliability Check

# Phase 1: deterministic build/static verification.
# The production AI pipeline remains manually locked in publish.yml.

on:
  push:
    branches: ["main", "fix/evidence-provenance-run401"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies with retry
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "npm install attempt $attempt/3"
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1

      - name: Generate search index
        run: npx tsx scripts/generate-search-index.ts

      - name: Verify evidence lineage
        run: npm run evidence-lineage:test

      - name: Verify authoritative evidence pack contract
        run: npm run evidence-pack:test

      - name: Verify authoritative evidence pack integration
        run: npm run evidence-pack:integration:test

      - name: Verify Story Fact Map V1
        run: node scripts/test-story-fact-map.mjs

      - name: Run real-data pre-writer integration
        run: node scripts/pre-writer-pipeline.mjs

      - name: Verify Phase 3 repair evidence guard
        run: npm run repair-evidence:test

      - name: Verify Phase 3 canonical claim verifier
        run: npm run claims:deterministic

      - name: Verify Run 405 claim calibration
        run: npm run claims:run405-calibration

      - name: Verify immutable claim provenance anchor
        run: npm run claims:provenance-anchor

      - name: Verify stable passage provenance regression
        run: npm run claims:passage-provenance

      - name: Verify evidence extraction headline context
        run: npm run evidence-extraction:test

      - name: Verify evidence brief publisher headline context
        run: npm run evidence-brief:publisher-headline:test

      - name: Verify writer evidence passage selection
        run: npm run writer-evidence-selection:test

      - name: Verify writer evidence claim mapping
        run: npm run writer-evidence-claim-mapping:test

      - name: Verify Phase 3 quality canonical evidence
        run: npm run quality-evidence:test

      - name: Verify Phase 3 adaptive publication guard
        run: npm run adaptive-publication:test

      - name: Verify Phase 4 Writer 3.0 architecture
        run: npm run writer-architecture:test

      - name: Verify Phase 5 smarter article blueprint
        run: npm run article-blueprint:test

      - name: Verify Phase 6 attribution and uncertainty lock
        run: npm run attribution-uncertainty:test

      - name: Verify Phase 7 political neutrality guard
        run: npm run political-neutrality:test

      - name: Verify Phase 8 humanization guard
        run: npm run humanization:test

      - name: Verify Phase 9 article depth guard
        run: npm run article-depth:test

      - name: Verify Phase 10 visual relevance planner
        run: npm run visual-planner:test

      - name: Verify Phase 11 adaptive AI provider routing
        run: npm run ai-router:test

      - name: Verify Phase 4 Writer 3.0 repetition guard
        run: npm run writer-architecture:test

      - name: Generate sitemap
        run: npx tsx scripts/generate-sitemap.ts

      - name: Build production export
        run: npm run build

      - name: Verify required static outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in out/index.html out/robots.txt out/sitemap.xml out/search-index.json; do
            test -f "$file"
          done
          echo "Required static outputs are present."

      - name: Check for accidental secret files
        shell: bash
        run: |
          set -euo pipefail
          if find out -type f \( -name '.env' -o -name '.env.*' -o -name '*secret*' \) -print -quit | grep -q .; then
            echo "Potential secret file detected in build output."
            exit 1
          fi
          echo "No secret-named files found in build output."

      - name: Reliability check passed
        run: echo "TrendForge Phase 1 reliability checks passed."
