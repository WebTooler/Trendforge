name: TrendForge Reliability Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reliability-check
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies with retry
        shell: bash
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "npm install attempt $attempt/3"
            if npm install --no-audit --no-fund; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 10)); fi
          done
          exit 1

      - name: Build production export
        run: npm run build

      - name: Verify required static outputs
        shell: bash
        run: |
          set -euo pipefail
          for file in out/index.html out/robots.txt out/sitemap.xml out/search/index.json; do
            test -f "$file"
          done
          echo "Required static outputs are present."

      - name: Check for leaked API key patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|gsk_[A-Za-z0-9_-]{20,}' out --include='*.html' --include='*.js' --include='*.json' >/dev/null 2>&1; then
            echo "Potential API key pattern detected in build output."
            exit 1
          fi
          echo "No known API key patterns found in build output."

      - name: Reliability check passed
        run: echo "TrendForge reliability checks passed."
